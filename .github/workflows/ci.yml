name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-pack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: memory-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CSWEET_MEMORY_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=memory-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          # The broker targets .NET 10; the library test host targets .NET 8.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore CSweet.Memory.slnx -p:UseLocalCSweetAgentSdk=false
      - run: dotnet build CSweet.Memory.slnx --configuration Release --no-restore -p:UseLocalCSweetAgentSdk=false
      - run: dotnet test CSweet.Memory.slnx --configuration Release --no-build --no-restore -p:UseLocalCSweetAgentSdk=false
      - run: dotnet pack CSweet.Memory.slnx --configuration Release --no-build --no-restore -p:UseLocalCSweetAgentSdk=false --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
